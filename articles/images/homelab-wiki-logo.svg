<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310">
  <defs>
    <linearGradient id="green5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8bb26"/>
      <stop offset="100%" style="stop-color:#98971a"/>
    </linearGradient>
  </defs>

  <!-- Server stack icon -->
  <g transform="translate(40, 30)">
    <!-- Rack outline -->
    <rect x="0" y="0" width="120" height="175" rx="6" fill="#504945" stroke="#a89984" stroke-width="2"/>
    <!-- Units -->
    <rect x="10" y="12" width="100" height="32" rx="3" fill="#3c3836"/>
    <rect x="10" y="52" width="100" height="32" rx="3" fill="#282828"/>
    <rect x="10" y="92" width="100" height="32" rx="3" fill="#3c3836"/>
    <rect x="10" y="132" width="100" height="32" rx="3" fill="#282828"/>
    <!-- LEDs -->
    <circle cx="24" cy="28" r="4" fill="#b8bb26"/>
    <circle cx="36" cy="28" r="4" fill="#b8bb26"/>
    <circle cx="24" cy="68" r="4" fill="#b8bb26"/>
    <circle cx="36" cy="68" r="4" fill="#b8bb26"/>
    <circle cx="24" cy="108" r="4" fill="#fabd2f"/>
    <circle cx="36" cy="108" r="4" fill="#b8bb26"/>
    <circle cx="24" cy="148" r="4" fill="#b8bb26"/>
    <circle cx="36" cy="148" r="4" fill="#fb4934"/>
    <!-- Ventilation dots -->
    <circle cx="78" cy="28" r="2.5" fill="#928374"/>
    <circle cx="88" cy="28" r="2.5" fill="#928374"/>
    <circle cx="98" cy="28" r="2.5" fill="#928374"/>
    <circle cx="78" cy="68" r="2.5" fill="#928374"/>
    <circle cx="88" cy="68" r="2.5" fill="#928374"/>
    <circle cx="98" cy="68" r="2.5" fill="#928374"/>
    <circle cx="78" cy="108" r="2.5" fill="#928374"/>
    <circle cx="88" cy="108" r="2.5" fill="#928374"/>
    <circle cx="98" cy="108" r="2.5" fill="#928374"/>
    <circle cx="78" cy="148" r="2.5" fill="#928374"/>
    <circle cx="88" cy="148" r="2.5" fill="#928374"/>
    <circle cx="98" cy="148" r="2.5" fill="#928374"/>
  </g>

  <!-- Main text -->
  <text x="200" y="95" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="54" font-weight="800" fill="#b8bb26">homelab</text>
  <text x="200" y="140" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="28" font-weight="300" fill="#a89984" letter-spacing="12">WIKI</text>

  <!-- Right side: uptime/status indicators (minimal underline style) -->
  <g transform="translate(580, 40)">
    <!-- Uptime -->
    <g transform="translate(0, 0)">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#fb4934" stroke-width="1.5"/>
      <polyline points="12,6 12,12 16,14" fill="none" stroke="#fb4934" stroke-width="1.5" stroke-linecap="round"/>
      <text x="30" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#fb4934">Up: 42 days</text>
      <line x1="0" y1="28" x2="180" y2="28" stroke="#fb4934" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Network -->
    <g transform="translate(0, 33)">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#b8bb26" stroke-width="1.5"/>
      <ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="#b8bb26" stroke-width="1"/>
      <line x1="3" y1="12" x2="21" y2="12" stroke="#b8bb26" stroke-width="1"/>
      <text x="30" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#b8bb26">Net: 12MB/s 4MB/s</text>
      <line x1="0" y1="28" x2="180" y2="28" stroke="#b8bb26" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Storage -->
    <g transform="translate(0, 66)">
      <rect x="2" y="3" width="20" height="18" rx="3" fill="none" stroke="#83a598" stroke-width="1.5"/>
      <circle cx="12" cy="13" r="5" fill="none" stroke="#83a598" stroke-width="1"/>
      <circle cx="12" cy="13" r="1.5" fill="#83a598"/>
      <text x="30" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#83a598">Storage: 2.4TB</text>
      <line x1="0" y1="28" x2="180" y2="28" stroke="#83a598" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- CPU -->
    <g transform="translate(0, 99)">
      <rect x="5" y="5" width="14" height="14" rx="2" fill="none" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="8" y1="3" x2="8" y2="5" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="12" y1="3" x2="12" y2="5" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="16" y1="3" x2="16" y2="5" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="8" y1="19" x2="8" y2="21" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="12" y1="19" x2="12" y2="21" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="16" y1="19" x2="16" y2="21" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="3" y1="8" x2="5" y2="8" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="3" y1="12" x2="5" y2="12" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="3" y1="16" x2="5" y2="16" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="19" y1="8" x2="21" y2="8" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="19" y1="12" x2="21" y2="12" stroke="#fabd2f" stroke-width="1.5"/>
      <line x1="19" y1="16" x2="21" y2="16" stroke="#fabd2f" stroke-width="1.5"/>
      <text x="30" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#fabd2f">CPU: 68%</text>
      <line x1="0" y1="28" x2="180" y2="28" stroke="#fabd2f" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Memory -->
    <g transform="translate(0, 132)">
      <rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="#d3869b" stroke-width="1.5"/>
      <rect x="5" y="9" width="3" height="6" rx="0.5" fill="#d3869b"/>
      <rect x="10" y="9" width="3" height="6" rx="0.5" fill="#d3869b"/>
      <rect x="15" y="9" width="3" height="6" rx="0.5" fill="#d3869b"/>
      <line x1="12" y1="18" x2="12" y2="20" stroke="#d3869b" stroke-width="1.5"/>
      <text x="30" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#d3869b">Mem: 12GB</text>
      <line x1="0" y1="28" x2="180" y2="28" stroke="#d3869b" stroke-width="1" opacity="0.4"/>
    </g>
  </g>

  <!-- Bash terminal prompt (mac style) -->
  <g transform="translate(40, 240)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="720" height="55" rx="8" fill="#282828" stroke="#665c54" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="720" height="20" rx="8" fill="#3c3836"/>
    <rect x="0" y="10" width="720" height="10" fill="#3c3836"/>
    <!-- Traffic light buttons -->
    <circle cx="16" cy="10" r="5" fill="#fb4934"/>
    <circle cx="32" cy="10" r="5" fill="#fabd2f"/>
    <circle cx="48" cy="10" r="5" fill="#b8bb26"/>
    <!-- Title text -->
    <text x="360" y="14" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#a89984" text-anchor="middle">dcorneschi@homelab: ~</text>
    <!-- Prompt -->
    <text x="15" y="42" font-family="'Courier New', monospace" font-size="14" font-weight="bold">
      <tspan fill="#b8bb26">dcorneschi</tspan><tspan fill="#a89984">@</tspan><tspan fill="#fabd2f">homelab</tspan><tspan fill="#a89984">:~$ </tspan><tspan fill="#ebdbb2">_</tspan>
    </text>
  </g>
</svg>
