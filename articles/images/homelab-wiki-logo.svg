<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="green5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>

  <!-- Server stack icon -->
  <g transform="translate(40, 35)">
    <!-- Rack outline -->
    <rect x="0" y="0" width="90" height="130" rx="6" fill="#555" stroke="#888" stroke-width="2"/>
    <!-- Units -->
    <rect x="8" y="10" width="74" height="24" rx="3" fill="#333"/>
    <rect x="8" y="40" width="74" height="24" rx="3" fill="#3a3a3a"/>
    <rect x="8" y="70" width="74" height="24" rx="3" fill="#333"/>
    <rect x="8" y="100" width="74" height="24" rx="3" fill="#3a3a3a"/>
    <!-- LEDs -->
    <circle cx="20" cy="22" r="3" fill="#2ecc71"/>
    <circle cx="30" cy="22" r="3" fill="#2ecc71"/>
    <circle cx="20" cy="52" r="3" fill="#2ecc71"/>
    <circle cx="30" cy="52" r="3" fill="#2ecc71"/>
    <circle cx="20" cy="82" r="3" fill="#f39c12"/>
    <circle cx="30" cy="82" r="3" fill="#2ecc71"/>
    <circle cx="20" cy="112" r="3" fill="#2ecc71"/>
    <circle cx="30" cy="112" r="3" fill="#e74c3c"/>
    <!-- Ventilation dots -->
    <circle cx="60" cy="22" r="2" fill="#999"/>
    <circle cx="68" cy="22" r="2" fill="#999"/>
    <circle cx="76" cy="22" r="2" fill="#999"/>
    <circle cx="60" cy="52" r="2" fill="#999"/>
    <circle cx="68" cy="52" r="2" fill="#999"/>
    <circle cx="76" cy="52" r="2" fill="#999"/>
  </g>

  <!-- Main text with stroke for dual-theme visibility -->
  <text x="170" y="90" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="54" font-weight="800" fill="#2ecc71">homelab</text>
  <text x="170" y="135" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="28" font-weight="300" fill="#888" letter-spacing="12">WIKI</text>

  <!-- Right side: uptime/status indicators -->
  <g transform="translate(570, 40)">
    <!-- Status cards -->
    <rect x="0" y="0" width="180" height="35" rx="6" fill="none" stroke="#888" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="6" fill="#2ecc71"/>
    <text x="32" y="22" font-family="monospace" font-size="13" fill="#2ecc71">Network: Online</text>

    <rect x="0" y="42" width="180" height="35" rx="6" fill="none" stroke="#888" stroke-width="1.5"/>
    <circle cx="18" cy="59" r="6" fill="#2ecc71"/>
    <text x="32" y="64" font-family="monospace" font-size="13" fill="#2ecc71">Storage: 2.4TB</text>

    <rect x="0" y="84" width="180" height="35" rx="6" fill="none" stroke="#888" stroke-width="1.5"/>
    <circle cx="18" cy="101" r="6" fill="#f39c12"/>
    <text x="32" y="106" font-family="monospace" font-size="13" fill="#f39c12">CPU: 68%</text>
  </g>
</svg>
