<!DOCTYPE html>
<html lang="en" data-theme="cursor">
<head>
  <meta charset="UTF-8">
  <title>Daniel Corneschi Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="themes.css">
  <style>
    .markdown-section {
      font-size: 15px;
    }
    /* Force heading and bold colors on all themes */
    [data-theme] .markdown-section h1,
    [data-theme] .markdown-section h2,
    [data-theme] .markdown-section h3,
    [data-theme] .markdown-section h4,
    [data-theme] .markdown-section h5,
    [data-theme] .markdown-section h6,
    [data-theme] .markdown-section h1 a,
    [data-theme] .markdown-section h2 a,
    [data-theme] .markdown-section h3 a,
    [data-theme] .markdown-section h4 a,
    [data-theme] .markdown-section h5 a,
    [data-theme] .markdown-section h6 a,
    [data-theme] .anchor span,
    [data-theme] .markdown-section .anchor span {
      color: var(--theme-heading) !important;
      text-decoration: none !important;
    }
    [data-theme] .markdown-section strong,
    [data-theme] .markdown-section b {
      color: var(--theme-heading) !important;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .markdown-section h5,
    .markdown-section h6 {
      margin-top: 0.6em;
      margin-bottom: 0.4em;
    }
    .markdown-section pre {
      margin-bottom: 0.5em;
      padding: 10px 15px;
    }
    .markdown-section pre > code {
      padding: 0;
      line-height: 1.4;
    }
    .markdown-section table td:nth-child(2) {
      font-size: 15px;
    }
    .markdown-section table td:nth-child(1) {
      font-size: 15px;
    }

    /* Theme switcher — trigger button in sidebar */
    .sidebar .theme-switcher {
      padding: 10px 15px;
      border-top: 1px solid var(--theme-border, #e8e8e8);
      margin-top: 20px;
    }
    .sidebar .theme-switcher button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--theme-border, #ccc);
      background: var(--theme-code-bg, #f8f8f8);
      color: var(--theme-text, #333);
      font-size: 13px;
      font-family: monospace;
      cursor: pointer;
      text-align: left;
    }
    .sidebar .theme-switcher button:hover {
      border-color: var(--theme-accent, #42b983);
    }

    /* Theme modal overlay */
    .theme-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .theme-modal-overlay.active {
      display: flex;
    }

    /* Theme modal panel — light frosted glass */
    .theme-modal {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      width: 360px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.12), 0 0 1px rgba(0,0,0,0.05) inset;
      backdrop-filter: blur(32px) saturate(1.4);
      -webkit-backdrop-filter: blur(32px) saturate(1.4);
    }

    .theme-modal-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    .theme-modal-header h3 {
      margin: 0 0 10px;
      color: #1a1a2e;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .theme-modal-header .tab-active {
      display: inline-block;
      padding: 4px 12px;
      background: #4a6cf7;
      color: #fff;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }

    .theme-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .theme-modal-group {
      padding: 10px 24px 4px;
      font-size: 10px;
      color: rgba(0, 0, 0, 0.4);
      text-transform: lowercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      margin-bottom: 2px;
    }

    .theme-modal-item {
      padding: 9px 24px;
      cursor: pointer;
      color: #2a2a3e;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease;
      border-radius: 0;
    }
    .theme-modal-item:hover {
      background: rgba(0, 0, 0, 0.04);
    }
    .theme-modal-item.selected {
      background: #4a6cf7;
      color: #fff;
    }
    .theme-modal-item.selected .checkmark {
      display: inline;
    }
    .theme-modal-item .checkmark {
      display: none;
      font-size: 12px;
    }
    .theme-modal-item .arrow {
      display: none;
    }
    .theme-modal-item.selected .arrow {
      display: inline;
      margin-right: 4px;
    }

    .theme-modal-footer {
      padding: 12px 24px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.4);
    }
    .theme-modal-footer kbd {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.04);
      color: #2a2a3e;
      font-size: 10px;
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>



  <script>
    window.$docsify = {
      name: '<span style="background: linear-gradient(135deg, var(--theme-accent, #42b983), var(--theme-accent-hover, #33a06f)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700; font-size: 22px; letter-spacing: -0.5px;">Daniel Corneschi</span><br><span style="font-size: 13px; color: var(--theme-muted, #7f8c8d); font-weight: 400; letter-spacing: 2px; text-transform: uppercase;">wiki</span>',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      search: {
        placeholder: 'Search',
        noData: 'No results',
        depth: 4,
        paths: 'auto'
      }
    };

    // Theme switcher logic
    function switchTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('docsify-theme', theme);
      updateModalSelection(theme);
    }

    function updateModalSelection(theme) {
      var items = document.querySelectorAll('.theme-modal-item');
      items.forEach(function(item) {
        if (item.dataset.theme === theme) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
    }

    function openThemeModal() {
      document.querySelector('.theme-modal-overlay').classList.add('active');
    }

    function closeThemeModal() {
      document.querySelector('.theme-modal-overlay').classList.remove('active');
    }

    // Load saved theme on startup
    (function() {
      var saved = localStorage.getItem('docsify-theme') || 'cursor';
      document.documentElement.setAttribute('data-theme', saved);
    })();

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      var overlay = document.querySelector('.theme-modal-overlay');
      if (!overlay) return;
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeThemeModal();
      }
    });

    // Close on overlay click
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('theme-modal-overlay')) {
        closeThemeModal();
      }
    });

    // Theme data
    var themes = {
      dark: [
        { id: 'catppuccin', name: 'catppuccin' },
        { id: 'tokyo-night', name: 'tokyo night' },
        { id: 'dracula', name: 'dracula' },
        { id: 'nord', name: 'nord' },
        { id: 'gruvbox', name: 'gruvbox' },
        { id: 'one-dark', name: 'one dark' },
        { id: 'solarized', name: 'solarized' },
        { id: 'kanagawa', name: 'kanagawa' },
        { id: 'rose-pine', name: 'rose pine' },
        { id: 'vesper', name: 'vesper' },
        { id: 'batman', name: 'batman' },
        { id: 'green-phosphor', name: 'green phosphor' }
      ],
      light: [
        { id: 'catppuccin-latte', name: 'catppuccin latte' },
        { id: 'tokyo-night-day', name: 'tokyo day' },
        { id: 'gruvbox-light', name: 'gruvbox light' },
        { id: 'one-light', name: 'one light' },
        { id: 'solarized-light', name: 'solarized light' },
        { id: 'kanagawa-lotus', name: 'kanagawa lotus' },
        { id: 'rose-pine-dawn', name: 'rose pine dawn' },
        { id: 'default', name: 'docsify default' },
        { id: 'cursor', name: 'cursor' },
        { id: 'green-mist', name: 'green mist' }
      ]
    };

    // Plugin to inject theme switcher button and modal
    function themeSwitcherPlugin(hook) {
      hook.doneEach(function() {
        // Add sidebar button
        if (!document.getElementById('theme-btn')) {
          var sidebar = document.querySelector('.sidebar-nav');
          if (!sidebar) return;
          var div = document.createElement('div');
          div.className = 'theme-switcher';
          div.innerHTML = '<button id="theme-btn" onclick="openThemeModal()">⚙ theme</button>';
          sidebar.appendChild(div);
        }

        // Add modal if not exists
        if (document.querySelector('.theme-modal-overlay')) return;
        var saved = localStorage.getItem('docsify-theme') || 'cursor';

        var html = '<div class="theme-modal">';
        html += '<div class="theme-modal-header"><h3>settings</h3><span class="tab-active">theme</span></div>';
        html += '<div class="theme-modal-body">';

        html += '<div class="theme-modal-group">dark</div>';
        themes.dark.forEach(function(t) {
          var sel = t.id === saved ? ' selected' : '';
          html += '<div class="theme-modal-item' + sel + '" data-theme="' + t.id + '" onclick="switchTheme(\'' + t.id + '\');closeThemeModal()">';
          html += '<span><span class="arrow">▸ </span>' + t.name + '</span>';
          html += '<span class="checkmark">✓</span>';
          html += '</div>';
        });

        html += '<div class="theme-modal-group">light</div>';
        themes.light.forEach(function(t) {
          var sel = t.id === saved ? ' selected' : '';
          html += '<div class="theme-modal-item' + sel + '" data-theme="' + t.id + '" onclick="switchTheme(\'' + t.id + '\');closeThemeModal()">';
          html += '<span><span class="arrow">▸ </span>' + t.name + '</span>';
          html += '<span class="checkmark">✓</span>';
          html += '</div>';
        });

        html += '</div>';
        html += '<div class="theme-modal-footer">';
        html += '<span>↑↓ select</span>';
        html += '<span><kbd>↵</kbd> apply  <kbd>esc</kbd> close</span>';
        html += '</div>';
        html += '</div>';

        var overlay = document.createElement('div');
        overlay.className = 'theme-modal-overlay';
        overlay.innerHTML = html;
        document.body.appendChild(overlay);
      });
    }

    window.$docsify.plugins = [themeSwitcherPlugin];

    // Mermaid configuration
    var defined = defined || {};
    defined.defined_mermaid = defined.defined_mermaid || mermaid.initialize({ startOnLoad: false, theme: 'default' });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-hcl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
