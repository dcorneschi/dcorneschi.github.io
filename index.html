    function updateModalSelection(theme) {
      var items = document.querySelectorAll('.theme-modal-item');
      items.forEach(function(item) {
        if (item.dataset.theme === theme) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
    }

    function openThemeModal() {
      document.querySelector('.theme-modal-overlay').classList.add('active');
    }

    function closeThemeModal() {
      document.querySelector('.theme-modal-overlay').classList.remove('active');
    }

    // Load saved theme on startup
    (function() {
      var saved = localStorage.getItem('docsify-theme') || 'cursor';
      document.documentElement.setAttribute('data-theme', saved);
    })();

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      var overlay = document.querySelector('.theme-modal-overlay');
      if (!overlay) return;
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeThemeModal();
      }
    });

    // Close on overlay click
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('theme-modal-overlay')) {
        closeThemeModal();
      }
    });

    // Theme data
    var themes = {
      dark: [
        { id: 'catppuccin', name: 'catppuccin' },
        { id: 'tokyo-night', name: 'tokyo night' },
        { id: 'dracula', name: 'dracula' },
        { id: 'nord', name: 'nord' },
        { id: 'gruvbox', name: 'gruvbox' },
        { id: 'one-dark', name: 'one dark' },
        { id: 'solarized', name: 'solarized' },
        { id: 'kanagawa', name: 'kanagawa' },
        { id: 'rose-pine', name: 'rose pine' },
        { id: 'vesper', name: 'vesper' },
        { id: 'batman', name: 'batman' },
        { id: 'green-phosphor', name: 'green phosphor' }
      ],
      light: [
        { id: 'catppuccin-latte', name: 'catppuccin latte' },
        { id: 'tokyo-night-day', name: 'tokyo day' },
        { id: 'gruvbox-light', name: 'gruvbox light' },
        { id: 'one-light', name: 'one light' },
        { id: 'solarized-light', name: 'solarized light' },
        { id: 'kanagawa-lotus', name: 'kanagawa lotus' },
        { id: 'rose-pine-dawn', name: 'rose pine dawn' },
        { id: 'default', name: 'docsify default' },
        { id: 'cursor', name: 'cursor' },
        { id: 'green-mist', name: 'green mist' }
      ]
    };

    // Plugin to inject theme switcher button and modal
    function themeSwitcherPlugin(hook) {
      hook.doneEach(function() {
        // Add sidebar button
        if (!document.getElementById('theme-btn')) {
          var sidebar = document.querySelector('.sidebar-nav');
          if (!sidebar) return;
          var div = document.createElement('div');
          div.className = 'theme-switcher';
          div.innerHTML = '<button id="theme-btn" onclick="openThemeModal()">⚙ theme</button>';
          sidebar.appendChild(div);
        }

        // Add modal if not exists
        if (document.querySelector('.theme-modal-overlay')) return;
        var saved = localStorage.getItem('docsify-theme') || 'cursor';

        var html = '<div class="theme-modal">';
        html += '<div class="theme-modal-header"><h3>settings</h3><span class="tab-active">theme</span></div>';
        html += '<div class="theme-modal-body">';

        html += '<div class="theme-modal-group">dark</div>';
        themes.dark.forEach(function(t) {
          var sel = t.id === saved ? ' selected' : '';
          html += '<div class="theme-modal-item' + sel + '" data-theme="' + t.id + '" onclick="switchTheme(\'' + t.id + '\');closeThemeModal()">';
          html += '<span><span class="arrow">▸ </span>' + t.name + '</span>';
          html += '<span class="checkmark">✓</span>';
          html += '</div>';
        });

        html += '<div class="theme-modal-group">light</div>';
        themes.light.forEach(function(t) {
          var sel = t.id === saved ? ' selected' : '';
          html += '<div class="theme-modal-item' + sel + '" data-theme="' + t.id + '" onclick="switchTheme(\'' + t.id + '\');closeThemeModal()">';
          html += '<span><span class="arrow">▸ </span>' + t.name + '</span>';
          html += '<span class="checkmark">✓</span>';
          html += '</div>';
        });

        html += '</div>';
        html += '<div class="theme-modal-footer">';
        html += '<span>↑↓ select</span>';
        html += '<span><kbd>↵</kbd> apply  <kbd>esc</kbd> close</span>';
        html += '</div>';
        html += '</div>';

        var overlay = document.createElement('div');
        overlay.className = 'theme-modal-overlay';
        overlay.innerHTML = html;
        document.body.appendChild(overlay);
      });
    }

    window.$docsify.plugins = [themeSwitcherPlugin];

    // Mermaid configuration
    var defined = defined || {};
    defined.defined_mermaid = defined.defined_mermaid || mermaid.initialize({ startOnLoad: false, theme: 'default' });
  </script>
